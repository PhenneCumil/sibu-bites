    // 3. Render Picture Feed Cards

      const feed = document.getElementById('foodListFeed');
      const empty = document.getElementById('emptyView');

      if (items.length === 0) {
        empty.classList.remove('hidden');
        return;
      }
      empty.classList.add('hidden');

        const isHalal = item.category === 'Halal';
        const isFav = bookmarks.includes(item.id);

        // Tap card to open mobile bottom sheet modal

          if (!e.target.closest('.bookmark-btn')) {
            openBottomSheet(item.id);
          }
        };

        card.innerHTML = `
          <!-- Picture Interface -->
          <div class="relative h-44 w-full overflow-hidden">
            <img src="${item.image}" alt="${item.name}" class="w-full h-full object-cover" loading="lazy" />
            <div class="absolute inset-0 bg-gradient-to-t from-black/60 via-transparent to-transparent"></div>
            
            <!-- Category Badge -->
            <div class="absolute top-3 left-3 flex gap-1.5">
              <span class="px-2.5 py-1 rounded-full text-[10px] font-bold text-white shadow-md flex items-center gap-1 ${isHalal ? 'bg-emerald-600' : 'bg-rose-600'}">
                <i class="fa-solid ${isHalal ? 'fa-check' : 'fa-bacon'}"></i> ${item.category}
              </span>
            </div>

            <!-- Bookmark Button -->
            <button onclick="toggleBookmark('${item.id}', event)" class="bookmark-btn absolute top-3 right-3 w-8 h-8 rounded-full bg-white/90 backdrop-blur-sm flex items-center justify-center text-xs shadow-md">
              <i class="fa-${isFav ? 'solid' : 'regular'} fa-heart ${isFav ? 'text-red-500' : 'text-slate-600'}"></i>
            </button>

            <!-- Bottom Picture Meta -->
            <div class="absolute bottom-2.5 left-3 right-3 flex justify-between items-end text-white text-xs">
              <div>
                <span class="font-bold text-sm block leading-tight drop-shadow-sm">${item.name}</span>
                <span class="text-[11px] text-amber-200">${item.chinese}</span>
              </div>
              <span class="bg-black/60 backdrop-blur-md px-2 py-0.5 rounded-lg text-[10px] font-semibold text-amber-300">
                ${item.rating}
              </span>
            </div>
          </div>

          <!-- Bottom Card Snippet -->
          <div class="p-3.5 flex items-center justify-between text-xs text-slate-500">
            <p class="truncate pr-2">${item.shortDesc}</p>
            <span class="text-amber-600 font-bold shrink-0 flex items-center gap-1">
              Details <i class="fa-solid fa-chevron-right text-[9px]"></i>
            </span>
          </div>
        `;
        feed.appendChild(card);
      });
    }

    // 4. Open Mobile Bottom Sheet (Modal Drawer)
    function openBottomSheet(foodId) {
      const food = sibuFoodItems.find(x => x.id === foodId);
      if (!food) return;

      const isHalal = food.category === 'Halal';

      document.getElementById('sheetImage').src = food.image;
      document.getElementById('sheetTitle').textContent = food.name;
      document.getElementById('sheetChinese').textContent = food.chinese;

      const badge = document.getElementById('sheetBadge');
      badge.textContent = isHalal ? "✓ Halal Muslim Friendly" : "✕ Traditional Non-Halal (Pork/Wine)";
      badge.className = `inline-block px-2.5 py-0.5 rounded-full text-[10px] font-bold mb-1 shadow text-white ${isHalal ? 'bg-emerald-600' : 'bg-rose-600'}`;

      document.getElementById('sheetDesc').textContent = food.desc;

      // Difference Card Styling
      const diffCard = document.getElementById('differenceCard');
      if (isHalal) {
        diffCard.className = "p-4 rounded-2xl border text-xs sm:text-sm leading-relaxed bg-emerald-50 border-emerald-200 text-emerald-900";
      } else {
        diffCard.className = "p-4 rounded-2xl border text-xs sm:text-sm leading-relaxed bg-rose-50 border-rose-200 text-rose-900";
      }
      document.getElementById('sheetDiff').textContent = food.differences;

      // Stalls / Locations Injection
      const locBox = document.getElementById('sheetLocations');
      locBox.innerHTML = '';
      food.locations.forEach(loc => {
        const item = document.createElement('div');
        item.className = "flex items-center justify-between p-3 bg-slate-100 rounded-xl";
        item.innerHTML = `
          <div>
            <h4 class="font-bold text-xs sm:text-sm text-slate-800">${loc.name}</h4>
            <p class="text-[11px] text-slate-500"><i class="fa-solid fa-location-arrow text-amber-500 mr-1"></i> ${loc.area}</p>
          </div>
          <a href="https://www.google.com/maps/search/?api=1&query=${loc.map}" target="_blank" class="px-3 py-1.5 bg-amber-500 active:bg-amber-600 text-white text-[11px] font-bold rounded-lg shadow-sm flex items-center gap-1">
            <i class="fa-solid fa-diamond-turn-right"></i> GPS
          </a>
        `;
        locBox.appendChild(item);
      });

      // Show sheet with slide up animation
      const sheet = document.getElementById('bottomSheet');
      const backdrop = document.getElementById('sheetBackdrop');
      backdrop.classList.remove('hidden');
      sheet.classList.remove('hidden', 'sheet-down');
      sheet.classList.add('flex', 'sheet-up');
    }

    // 5. Close Mobile Bottom Sheet
    function closeBottomSheet() {
      const sheet = document.getElementById('bottomSheet');
      const backdrop = document.getElementById('sheetBackdrop');
      sheet.classList.remove('sheet-up');
      sheet.classList.add('sheet-down');
      setTimeout(() => {
        sheet.classList.add('hidden');
        backdrop.classList.add('hidden');
      }, 200);
    }

    // 6. Filter & Segment Tab Controls
    function setTab(category) {
      activeFilter = category;
      document.getElementById('appSearch').value = '';

      // Reset pill styles
      const pills = ['all', 'halal', 'nonhalal'];
      pills.forEach(p => {
        const btn = document.getElementById(`pill-${p}`);
        if (btn) {
          btn.className = "flex-1 py-2 text-xs font-bold rounded-xl bg-white text-slate-600 border border-slate-200 transition";
        }
      });

      if (category === 'all') {
        document.getElementById('pill-all').className = "flex-1 py-2 text-xs font-bold rounded-xl bg-slate-900 text-white shadow-sm transition";
      } else if (category === 'Halal') {
        document.getElementById('pill-halal').className = "flex-1 py-2 text-xs font-bold rounded-xl bg-emerald-600 text-white shadow-sm transition";
      } else if (category === 'Non-Halal') {
        document.getElementById('pill-nonhalal').className = "flex-1 py-2 text-xs font-bold rounded-xl bg-rose-600 text-white shadow-sm transition";
      }

      // Update Bottom Navigation Bar icons
      document.getElementById('nav-home').className = `flex flex-col items-center gap-1 text-[10px] font-bold ${category === 'all' ? 'text-amber-600' : 'text-slate-400'}`;
      document.getElementById('nav-halal').className = `flex flex-col items-center gap-1 text-[10px] font-bold ${category === 'Halal' ? 'text-emerald-600' : 'text-slate-400'}`;
      document.getElementById('nav-nonhalal').className = `flex flex-col items-center gap-1 text-[10px] font-bold ${category === 'Non-Halal' ? 'text-rose-600' : 'text-slate-400'}`;

      filterAndRender();
    }

    function filterStory(cat) {
      setTab(cat);
    }

    function filterDishName(name) {
      document.getElementById('appSearch').value = name;
      handleSearch();
    }

    function handleSearch() {
      filterAndRender();
    }

    function filterAndRender() {
      const q = document.getElementById('appSearch').value.toLowerCase().trim();
      const filtered = sibuFoodItems.filter(item => {
        const matchCat = activeFilter === 'all' || item.category === activeFilter;
        const matchSearch = item.name.toLowerCase().includes(q) || 
                            item.chinese.includes(q) || 
                            item.desc.toLowerCase().includes(q);
        return matchCat && matchSearch;
      });
      renderList(filtered);
    }

    // 7. Favorite / Bookmark Features
    function toggleBookmark(id, event) {
      event.stopPropagation();
      if (bookmarks.includes(id)) {
        bookmarks = bookmarks.filter(b => b !== id);
      } else {
        bookmarks.push(id);
      }
      document.getElementById('favCount').textContent = bookmarks.length;
      filterAndRender();
    }

    function toggleBookmarkView() {
      if (bookmarks.length === 0) {
        alert("Your bucket list is empty! Tap the heart on any food card to bookmark it.");
        return;
      }
      const savedItems = sibuFoodItems.filter(item => bookmarks.includes(item.id));
      renderList(savedItems);
    }

    // 8. Update Status Bar Mobile Clock
    function updatePhoneClock() {
      const now = new Date();
      let hours = now.getHours();
      let minutes = now.getMinutes();
      minutes = minutes < 10 ? '0' + minutes : minutes;
      document.getElementById('currentTime').textContent = `${hours}:${minutes}`;
    }
    setInterval(updatePhoneClock, 1000);
    updatePhoneClock();

    // 9. Initial Load Trigger (Directly renders feed without authentication checks)
    renderList(sibuFoodItems);
  </script>
</body>
</html>
